# src/main/resources/application-sit.yml
server:
  port: 8081
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript,image/svg+xml

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}


spring:
  main:
    web-application-type: reactive
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  # ✅ Resource Server (validate JWT from RH SSO / Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: https://sso.dxc.go.th/auth/realms/DXC
          # If issuer discovery ever mismatches behind reverse proxy, comment issuer-uri and use:
          jwk-set-uri: https://sso.dxc.go.th/auth/realms/DXC/protocol/openid-connect/certs
          

  # 🔌 No remote Config for SIT unless you really use it
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: true
    loadbalancer:
      enabled: true
    # ❌ Removed gateway-specific config; search-platform is not the gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # No oauth2Login here; use a pasted Bearer token if needed


# ================== EUREKA (SERVICE DISCOVERY) ==================
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: >
        http://cloud-registry-01.ad.thaidxc.org:8761/eureka/,
        http://cloud-registry-02.ad.thaidxc.org:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}



logging:
  level:
    th.go.dxc.platform.search: DEBUG
    org.springframework.security: WARN
    reactor.netty.http.client: WARN
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN
    com.netflix.discovery: WARN
    org.springframework.security.oauth2.jwt: WARN


# CORS used by your CorsConfig/CorsProperties
cors:
  allowed-origins:
    - https://search-ui.sit.dxc.go.th
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,User-Agent
  allow-credentials: false
  max-age: 10m

# ================== PLATFORM SETTINGS ==================
platform:
  catalog:
    organizations:
      - id: dop
        name: กรมคุมประพฤติ
        description: กรมคุมประพฤติ กระทรวงยุติธรรม
      - id: doc
        name: กรมราชทัณฑ์
        description: กรมราชทัณฑ์ กระทรวงยุติธรรม
      - id: dopa
        name: กรมการปกครอง
        description: กรมการปกครอง กระทรวงมหาดไทย
      - id: djop
        name: กรมพินิจและคุ้มครองเด็กและเยาวชน
        description: กรมพินิจและคุ้มครองเด็กและเยาวชน กระทรวงยุติธรรม
      - id: dopa
        name: กรมการปกครองทหาร
        description: กรมการปกครองทหาร กระทรวงกลาโหม
    datasets:
      - id: dop.probationers
        name: ผู้ถูกคุมประพฤติ
        description: รายการข้อมูล ผู้ถูกคุมประพฤติ
        owner-org-id: dop
        route:
          service-id: dxc-qm-dop-probationer-service
          path: /api/v2/dop/probationers
        mapping:
          canonical-search-fields:
            "person.citizen_id": "citizenCardNumber"
        domains:
          "person":
            "citizen_id":
              pointer: "citizenCardNumber"
            "full_name":
              pointer: "caseName"
          "address":
            "province":
              pointer: "provinceName"
            "district":
              pointer: "districtName"
            "sub_district":
              pointer: "subDistrictName"
          "crime":
            "case_no": 
              pointer: "decidedCaseId"
            "court_name": 
              pointer: "courtName"
            "offence": 
              pointer: "predicateOffence"
      - id: doc.prisoner
        name: ผู้ต้องขัง (คดีที่พิพากษาแล้ว)
        description: รายการข้อมูล ผู้ต้องขัง (คดีที่พิพากษาแล้ว)
        owner-org-id: doc
        route:
          service-id: dxc-qm-doc-prisoner-service
          path: /api/v2/doc/prisoners
          headers:
            X-User-Nin: "{user.nin}"    # ✅ fixed double-colon
        mapping:
          canonical-search-fields:
            "person.citizen_id": "citizenCardNumber"
        domains:
          "person":
            "citizen_id":
              pointer: "citizenCardNumber"
            "first_name":
              pointer: "firstName"
            "last_name":
              pointer: "lastName"
          "address":
            "province":
              pointer: "addressProvinceText"
            "district":
              pointer: "addressAmphurText"
            "sub_district":
              pointer: "addressTumbonText"
          "crime":
            "case_no": 
              pointer: "decidedCaseId"
            "court_name": 
              pointer: "courtName"
            "offence": 
              pointer: "allegation"
      - id: djop.juvenile-offender-new
        name: ผู้ต้องหาหรือจำเลยในคดีเด็กและเยาวชน
        description: รายการข้อมูล ผู้ต้องหาหรือจำเลยในคดีเด็กและเยาวชน
        owner-org-id: djop
        route:
          service-id: dxc-qm-djop-juvenile-offender-2567-service
          path: /api/qm/v2/djop/juvenile-offender-2567
          headers:
            X-User-Nin: "{user.nin}"    # ✅ fixed double-colon
        mapping:
          canonical-search-fields:
            "person.citizen_id": "idCardNo"
          base-pointer: ""
        domains:
          "person":
            "citizen_id":
              pointer: "jvnCardId"
            "first_name":
              pointer: "jvnFname"
            "last_name":
              pointer: "jvnLname"
          "address":
            "province":
              pointer: "jvnLiveProvince"
          "crime":
            "case_no": 
              pointer: "/caseDetailList/0/redCaseNum"
            "court_name": 
              pointer: "/caseDetailList/0/courtName"
            "offence": 
              pointer: "/caseDetailList/0/allegationName"
      - id: dopa.moi-dopa-person
        name: ประชาชน
        description: รายการข้อมูล ประชาชน กรมการปกครอง กระทรวงมหาดไทย
        owner-org-id: dopa
        route:
          service-id: dxc-qm-doc-prisoner-service
          path: /api/v2/moi-linkage/persons/{citizen_id}/moi-dopa-persons
          headers:
            X-User-Nin: "{user.nin}"    # ✅ fixed double-colon
    domains:
      - id: address
        name: ที่อยู่
        description: ข้อมูลที่อยู่ของบุคคล
        canonical-keys:
          - full_address
          - province
          - district
          - sub_district
          - postcode
      - id: person
        name: ข้อมูลส่วนบุคคล
        description: ข้อมูลส่วนบุคคลทั่วไป
        canonical-keys:
          - citizen_id
          - full_name
          - first_name
          - last_name
      - id: crime
        name: คดีอาญา
        description: ข้อมูลคดีอาญา
        canonical-keys:
          - case_no
          - court_name
          - offence
    specialized-reports:
      - id: idb-dop-person-report
        name: รายงานผู้ถูกคุมประพฤติ
        owner-org-id: dop
        domain-ids:
          - person
          - address
          - crime
      - id: idb-doc-person-report
        name: รายงานผู้ต้องขัง
        owner-org-id: doc
        domain-ids:
          - person
          - address
      - id: idb-djop-person-report
        name: รายงานผู้ต้องหาหรือจำเลยในคดีเด็กและเยาวชน
        owner-org-id: djop
        domain-ids:
          - person
          - address
    
  search:
    cache:
      ttl:
        detail-ttl: PT30M
  report:
    gotenberg:
      base-url: http://localhost:30000
