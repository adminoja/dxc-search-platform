        description: ข้อมูลส่วนบุคคลทั่วไป
        canonical-keys:
          - citizen_id
          - full_name
          - first_name
          - last_name
      - id: crime
        name: คดีอาญา
        description: ข้อมูลคดีอาญา
        canonical-keys:
          - case_no
          - court_name
          - offence
    datasets:
      - id: dop.probationers
        name: ผู้ถูกคุมประพฤติ
        description: รายการข้อมูล ผู้ถูกคุมประพฤติ
        owner-org-id: dop
        route:
          service-id: dxc-qm-dop-probationer-service
          path: /api/v2/dop/probationers
          data:
            is-array: true
            pointers:
              content: /content
              page-number: /number
              page-size: /size
              number-of-elements: /numberOfElements
              total-elements: /totalElements
        mapping:
          canonical-search-fields:
            "person.citizen_id": "citizenCardNumber"
        domains:
          "person":
            "citizen_id":
              pointer: "citizenCardNumber"
            "full_name":
              pointer: "caseName"
          "address":
            "province":
              pointer: "provinceName"
            "district":
              pointer: "districtName"
            "sub_district":
              pointer: "subDistrictName"
          "crime":
            "case_no": 
