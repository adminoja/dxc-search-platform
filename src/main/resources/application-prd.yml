server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript,image/svg+xml

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: ${MANAGEMENT_BASE_PATH:/actuator}
  ssl:
    enabled: ${MANAGEMENT_SSL_ENABLED:false}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:@project.artifactId@}
  config:
    import: "configserver:"
  cloud:
    config:
      enabled: true
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 5000
      discovery:
        enabled: true
        service-id: ${CONFIG_SERVICE_ID:dxc-config-server}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URIS:http://cloud-registry-01.ad.thaidxc.org:8761/eureka/,http://cloud-registry-02.ad.thaidxc.org:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    ip-address: ${HOST_IP:10.14.33.70}
    prefer-ip-address: true
    non-secure-port: ${server.port}
    non-secure-port-enabled: ${EUREKA_NONSECURE_ENABLED:true}
    secure-port: ${APP_SECURE_PORT:8443}
    secure-port-enabled: ${EUREKA_SECURE_ENABLED:false}

    metadata-map:
      management.port: ${management.server.port}
      management.context-path: ${management.endpoints.web.base-path}

    # Explicit HTTP URLs (no HTTPS)
    health-check-url: "http://${HOST_IP:${ip-address}}:${management.server.port}${management.endpoints.web.base-path}/health"
    status-page-url:  "http://${HOST_IP:${ip-address}}:${management.server.port}${management.endpoints.web.base-path}/info"

    # Remove/comment these in HTTP-only:
    # secure-health-check-url:
    # secure-status-page-url:

    instance-id: "${spring.application.name}:${HOST_IP:${ip-address}}:${server.port}:${HOSTNAME}"
