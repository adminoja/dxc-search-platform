# /srv/dxc-search-platform/docker-compose.yml
name: dxc-search

networks:
  dxc_net: { driver: bridge }

volumes:
  app_logs:
  gotenberg_tmp:

services:

  app:
    image: gitlab.clearskysolutions.co.th:4567/dxc/platform/dxc-search-platform:${APP_TAG:-1.0.3}
    depends_on:
      gotenberg:
        condition: service_started

    environment:
      # Locale / profiles
      TZ: ${TZ:-Asia/Bangkok}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd}

      # === Host / Ports ===
      HOST_IP: ${HOST_IP:-10.14.33.70}
      SERVER_PORT: ${SERVER_PORT:-8081}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-${SERVER_PORT:-8082}}
      MANAGEMENT_BASE_PATH: ${MANAGEMENT_BASE_PATH:-/actuator}

      # === Eureka / SBA ===
      EUREKA_URIS: ${EUREKA_URIS:-http://cloud-registry-01.ad.thaidxc.org:8761/eureka/,http://cloud-registry-02.ad.thaidxc.org:8761/eureka/}
      EUREKA_NONSECURE_ENABLED: ${EUREKA_NONSECURE_ENABLED:-true}
      EUREKA_SECURE_ENABLED: ${EUREKA_SECURE_ENABLED:-false}

      # === SSL / HTTPS toggles ===
      APP_SSL_ENABLED: ${APP_SSL_ENABLED:-false}
      MANAGEMENT_SSL_ENABLED: ${MANAGEMENT_SSL_ENABLED:-false}

      # === External service URLs ===
      PLATFORM_REPORT_GOTENBERG_URL: ${PLATFORM_REPORT_GOTENBERG_URL:-http://gotenberg:3000}

      # === JVM / Paketo / Logging (optional) ===
      BPL_JVM_HEAP_RATIO: ${BPL_JVM_HEAP_RATIO:-70}
      BPL_JVM_HEAD_ROOM: ${BPL_JVM_HEAD_ROOM:-10}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-10m}
      LOG_MAX_FILE: ${LOG_MAX_FILE:-5}

    volumes:
      # Host time & timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Custom CA certs (PEM .crt files on host)
      - ${HOST_CERTS_DIR:-/srv/dxc-search-platform/certs}:/usr/local/share/ca-certificates/extra:ro
      # Persisted app logs (optional)
      - app_logs:/var/log/app

    # Paketo/Buildpacks: refresh trust store, then start web process
    command: ["/bin/bash","-lc","update-ca-certificates || true; exec /cnb/process/web"]

    restart: unless-stopped
    read_only: true
    # If Netty warns about noexec on /tmp, you can add :exec
    tmpfs:
      - /tmp
      - /run
    security_opt: [ "no-new-privileges:true" ]

    # Healthcheck hits the management endpoint (falls back to app port if unset)
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:${MANAGEMENT_SERVER_PORT:-${SERVER_PORT:-8082}}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s

    # Expose app port (host:container) driven by APP_PORT
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
      # If you want to expose the management port separately, uncomment the next line:
      - "${MANAGEMENT_SERVER_PORT:-${SERVER_PORT:-8082}}:${MANAGEMENT_SERVER_PORT:-${SERVER_PORT:-8082}}"

    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-5}"

    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS_LIMIT:-2.0}"
          memory: "${APP_MEM_LIMIT:-3072M}"   # container cap → heap derived via BPL_* vars
        reservations:
          cpus: "${APP_CPUS_RES:-0.25}"
          memory: "${APP_MEM_RES:-256M}"

    networks: [ dxc_net ]

  gotenberg:
    image: gotenberg/gotenberg:${GOTENBERG_TAG:-8.9.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^(file://.*|data:.*|https?://.*)$"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gotenberg_tmp:/tmp/gotenberg
      # If Gotenberg must also trust custom CAs, you can add:
      # - ${HOST_CERTS_DIR:-/srv/dxc-search-platform/certs}:/usr/local/share/ca-certificates/extra:ro
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-5}"
    deploy:
      resources:
        limits:
          cpus: "${GOTENBERG_CPUS_LIMIT:-2.0}"
          memory: "${GOTENBERG_MEM_LIMIT:-1536M}"
        reservations:
          cpus: "${GOTENBERG_CPUS_RES:-0.25}"
          memory: "${GOTENBERG_MEM_RES:-256M}"
    networks: [ dxc_net ]
