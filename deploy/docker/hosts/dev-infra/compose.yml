# Dev Infra: run infra-only locally (no API)
services:
  gotenberg:
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits: { cpus: "2.0", memory: "2g" }
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^(file://.*|data:.*|https?://.*)$"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [dxc_net]
  redis:
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "512m" }

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB-dxc}
      POSTGRES_USER: ${POSTGRES_USER-dxc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-local_dev_only}
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD-minioadmin}
    volumes:
      - minio_data:/data
