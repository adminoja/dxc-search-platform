services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB-dxc}
      POSTGRES_USER: ${POSTGRES_USER-dxc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER-dxc} -d ${POSTGRES_DB-dxc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [infra]
